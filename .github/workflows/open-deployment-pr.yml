name: Open verified deployment PR

on:
  push:
    branches:
      - 'deploy/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: open-deployment-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open deployment pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          if [[ ! "${branch}" =~ ^deploy/private-[0-9]+-[0-9]+$ ]]; then
            echo "Refusing unexpected deployment branch: ${branch}"
            exit 1
          fi

          existing="$(gh pr list --head "${branch}" --base main --state open --json number --jq '.[0].number // empty')"

          if [ -n "${existing}" ]; then
            echo "Deployment PR #${existing} already exists."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "${branch}" \
            --title "Deploy verified English Quest build" \
            --body "Generated from the private source repository only after Guardrails, artifact validation, and mobile/desktop Playwright passed. After trusted validation passes, this PR is automatically merged; this workflow never writes directly to main."
