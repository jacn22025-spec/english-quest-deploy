name: Open verified deployment PR

on:
  push:
    branches:
      - 'deploy/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open deployment pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch="${GITHUB_REF_NAME}"
          existing="$(gh pr list --head "${branch}" --base main --state open --json number --jq '.[0].number // empty')"

          if [ -n "${existing}" ]; then
            echo "Deployment PR #${existing} already exists."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "${branch}" \
            --title "Deploy verified English Quest build" \
            --body "Generated from the private source repository only after Guardrails, artifact validation, and mobile/desktop Playwright passed. Review and merge manually; this workflow never writes directly to main."
