name: Post-deploy Pages Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'deployment-manifest.json'
      - 'index.html'
      - '.nojekyll'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-deploy-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify exact Public main deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_URL: https://jacn22025-spec.github.io/english-quest-deploy/
    steps:
      - name: Checkout Public main without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate expected deployment manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, re

          manifest = json.loads(pathlib.Path("deployment-manifest.json").read_text(encoding="utf-8"))
          if manifest.get("schema") != 1 or manifest.get("source") != "private-vite-build":
              raise SystemExit("Unexpected deployment manifest identity")
          source_sha = manifest.get("source_commit_sha", "")
          if not re.fullmatch(r"[0-9a-f]{40}", source_sha):
              raise SystemExit("source_commit_sha must be a full lowercase Git SHA")

          index_bytes = pathlib.Path("index.html").read_bytes()
          item = (manifest.get("files") or {}).get("index.html")
          if not item:
              raise SystemExit("Manifest does not record index.html")
          if item.get("bytes") != len(index_bytes):
              raise SystemExit("Public main index byte count differs from manifest")
          if item.get("sha256") != hashlib.sha256(index_bytes).hexdigest():
              raise SystemExit("Public main index SHA-256 differs from manifest")
          print(f"Expecting deployed Private source commit {source_sha}")
          PY

      - name: Wait for Pages to deploy this exact Public main
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, time, urllib.parse, urllib.request

          base = os.environ["PRODUCTION_URL"]
          expected = json.loads(pathlib.Path("deployment-manifest.json").read_text(encoding="utf-8"))
          expected_sha = expected["source_commit_sha"]
          remote_manifest = None
          last_error = None

          for attempt in range(1, 17):
              try:
                  stamp = int(time.time())
                  manifest_url = urllib.parse.urljoin(base, f"deployment-manifest.json?smoke={stamp}")
                  request = urllib.request.Request(
                      manifest_url,
                      headers={"Cache-Control": "no-cache", "User-Agent": "English-Quest-Post-Deploy-Smoke"}
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      remote_manifest = json.loads(response.read().decode("utf-8"))
                  deployed_sha = remote_manifest.get("source_commit_sha")
                  if deployed_sha == expected_sha:
                      print(f"Pages reached expected source commit on attempt {attempt}: {expected_sha}")
                      last_error = None
                      break
                  last_error = RuntimeError(
                      f"Pages still exposes source_commit_sha={deployed_sha!r}; expected {expected_sha}"
                  )
              except Exception as exc:
                  last_error = exc
              print(f"Attempt {attempt}: {last_error}")
              if attempt < 16:
                  time.sleep(15)

          if last_error is not None:
              raise SystemExit(f"Pages did not deploy the expected Public main: {last_error}")
          if remote_manifest.get("schema") != 1 or remote_manifest.get("source") != "private-vite-build":
              raise SystemExit("Unexpected deployed manifest identity")

          index_url = urllib.parse.urljoin(base, f"index.html?smoke={int(time.time())}")
          request = urllib.request.Request(
              index_url,
              headers={"Cache-Control": "no-cache", "User-Agent": "English-Quest-Post-Deploy-Smoke"}
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              index_bytes = response.read()
          html = index_bytes.decode("utf-8")
          if not re.search(r"<!doctype html", html, re.I) or not re.search(r"</html>", html, re.I):
              raise SystemExit("Deployed game document is incomplete")
          if not re.search(r'id=["\']home["\']', html):
              raise SystemExit("Deployed game document is missing #home")
          if "eq38" not in html:
              raise SystemExit("Deployed game document is missing eq38 compatibility marker")
          if re.search(r"sourceMappingURL\s*=", html):
              raise SystemExit("Deployed game document exposes a source map")

          item = (remote_manifest.get("files") or {}).get("index.html")
          if not item:
              raise SystemExit("Deployed manifest does not record index.html")
          if item.get("bytes") != len(index_bytes):
              raise SystemExit("Deployed index byte count differs from manifest")
          if item.get("sha256") != hashlib.sha256(index_bytes).hexdigest():
              raise SystemExit("Deployed index SHA-256 differs from manifest")

          refs = re.findall(r"""(?:src|href)=["']([^"'#?]+)""", html, re.I)
          checked = 0
          for ref in refs:
              if any(token in ref for token in ("$", "{", "}")):
                  continue
              parsed = urllib.parse.urlparse(ref)
              if parsed.scheme and parsed.scheme not in ("http", "https"):
                  continue
              url = urllib.parse.urljoin(base, ref)
              if urllib.parse.urlparse(url).netloc != urllib.parse.urlparse(base).netloc:
                  continue
              request = urllib.request.Request(url, headers={"User-Agent": "English-Quest-Post-Deploy-Smoke"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status >= 400:
                      raise RuntimeError(f"{url}: HTTP {response.status}")
              checked += 1
          if checked == 0:
              raise SystemExit("No literal same-origin production assets found")
          print(f"Post-deploy smoke passed for {expected_sha}; verified {checked} literal assets.")
          PY
