name: Auto-merge verified deployment PR

on:
  workflow_run:
    workflows: ["Validate deployment PR"]
    types: [completed]

permissions:
  contents: read

jobs:
  merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Merge exact verified deployment PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          prs="$(gh pr list --state open --base main --json number,headRefName,headRefOid,isDraft)"
          pr="$(jq -c --arg sha "${HEAD_SHA}" '[.[] | select(.headRefOid==$sha and (.headRefName|test("^deploy/private-[0-9]+-[0-9]+$")) and (.isDraft==false))] | if length==1 then .[0] else empty end' <<<"${prs}")"

          if [ -z "${pr}" ]; then
            echo "No unique open verified deployment PR matches exact head SHA; refusing merge."
            exit 1
          fi

          number="$(jq -r '.number' <<<"${pr}")"
          branch="$(jq -r '.headRefName' <<<"${pr}")"

          run="$(gh api "repos/${GH_REPO}/actions/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=100")"
          ok="$(jq '[.workflow_runs[] | select(.name=="Validate deployment PR" and .head_sha=="'"${HEAD_SHA}"'" and .status=="completed" and .conclusion=="success")] | length' <<<"${run}")"
          if [ "${ok}" -lt 1 ]; then
            echo "Exact deployment SHA has no successful validation run; refusing merge."
            exit 1
          fi

          echo "Merging verified deployment PR #${number} from ${branch} at ${HEAD_SHA}."
          gh pr merge "${number}" --repo "${GH_REPO}" --merge --match-head-commit "${HEAD_SHA}"
